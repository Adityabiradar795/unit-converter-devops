apiVersion: apps/v1
kind: Deployment
metadata:
  name: unit-converter-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unit-converter
  template:
    metadata:
      labels:
        app: unit-converter
    spec:
      containers:
      - name: unit-converter
        image: unit-converter:latest  # Agar local image use kar rahe ho (Minikube/Kind)
        imagePullPolicy: Never        # Local Docker image load karne ke liye zaroori hai
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: unit-converter-service
spec:
  type: NodePort
  selector:
    app: unit-converter
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080